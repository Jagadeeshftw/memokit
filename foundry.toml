[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "scripts"
libs = ["lib", "node_modules"]

# Mirrors flare-foundation/flare-smart-accounts so our facets are drop-in
# compatible with their diamond (see PHASE1.md, "facet shape").
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Strip CBOR metadata so PersonalAccountProxy creation code -- and therefore
# every CREATE2 account address -- does not drift when a comment changes.
bytecode_hash = "none"
cbor_metadata = false

# Fork tests need the network and ffi; they run under `FOUNDRY_PROFILE=fork` (npm run test:fork).
no_match_path = "test/fork/**"

fs_permissions = [
    { access = "read-write", path = "./fixtures" },
    # Read-only: SelectorCollision.t.sol enumerates memokit's selectors from the compiled
    # artifacts' methodIdentifiers, so no hand-kept list can fall behind the code.
    { access = "read", path = "./out" },
]

[fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
flare = "https://flare-api.flare.network/ext/C/rpc"
coston2 = "https://coston2-api.flare.network/ext/C/rpc"

# Fork tests: Flare mainnet at a pinned block, proofs built by the SDK through ffi.
# Simulated verification -- see test/fork/ForkBase.t.sol. ffi stays off in every other profile.
[profile.fork]
ffi = true
match_path = "test/fork/**"
no_match_path = "test/__none__/**"
